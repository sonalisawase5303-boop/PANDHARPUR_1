    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.95);
            --panel-border: rgba(255, 255, 255, 0.1);

        html, body { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-dark); color: var(--text-main); }

        .section-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-sub); margin-bottom: 10px; }
        .layer-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; }
