<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <title>Pandharpur Web-GIS Dashboard</title>

    <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet" href="resources/fontawesome-all.min.css">
    <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
    <link rel="stylesheet" href="./resources/qgis2web.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.85);
            --panel-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #38bdf8;
            --card-bg: rgba(15, 23, 42, 0.7);
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-dark); color: var(--text-main); }
        #app-container { display: flex; flex-direction: column; width: 100vw; height: 100vh; }
        header { height: 60px; background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid var(--panel-border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 1000; }
        .header-title { font-size: 1.1rem; font-weight: 600; color: var(--text-main); }
        .workspace { display: flex; flex: 1; position: relative; overflow: hidden; }
        #sidebar { width: 320px; background: var(--panel-bg); border-right: 1px solid var(--panel-border); display: flex; flex-direction: column; z-index: 900; padding: 15px; overflow-y: auto; }
        .section-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-sub); margin-bottom: 10px; }
        .layer-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; }
        #map { flex: 1; width: 100%; height: 100%; background-color: #0b132b; }
        .ol-popup { position: absolute; background: var(--panel-bg); border: 1px solid var(--panel-border); padding: 12px; border-radius: var(--radius); bottom: 15px; left: -50px; min-width: 250px; color: var(--text-main); z-index: 1000; }
        .ol-popup-closer { text-decoration: none; position: absolute; top: 8px; right: 10px; color: var(--text-sub); }
    </style>
</head>
<body>
    <div id="app-container">
        <header>
            <div class="header-title"><i class="fas fa-map-marked-alt" style="color: var(--accent-color);"></i> Pandharpur Web-GIS Portal</div>
        </header>
        <div class="workspace">
            <div id="sidebar">
                <div class="section-title">Layers Control</div>
                <div class="layer-item"><span>Buildings</span><input type="checkbox" id="toggle-BUIDING_0" checked></div>
                <div class="layer-item"><span>Land Use</span><input type="checkbox" id="toggle-LANDUSE_1" checked></div>
                <div class="layer-item"><span>Railways</span><input type="checkbox" id="toggle-RAILWAYS_2_2" checked></div>
                <div class="layer-item"><span>Roads</span><input type="checkbox" id="toggle-ROAD_3" checked></div>
                <div class="layer-item"><span>Water Bodies</span><input type="checkbox" id="toggle-WATER_4" checked></div>
                <div class="layer-item"><span>Secondary Water</span><input type="checkbox" id="toggle-WATER1_1_5" checked></div>
                <div class="layer-item"><span>Pandharpur Boundary</span><input type="checkbox" id="toggle-Pandharpur1_6" checked></div>
            </div>
            <div id="map">
                <div id="popup" class="ol-popup" style="display:none;">
                    <a href="#" id="popup-closer" class="ol-popup-closer">&times;</a>
                    <div id="popup-content"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="resources/qgis2web_expressions.js"></script>
    <script src="./resources/functions.js"></script>
    <script src="./resources/ol.js"></script>
    <script src="./resources/ol-layerswitcher.js"></script>
    <script src="resources/photon-geocoder-autocomplete.min.js"></script>
    <script src="resources/olms.js"></script>
    
    <script src="layers/BUIDING_0.js"></script>
    <script src="layers/LANDUSE_1.js"></script>
    <script src="layers/RAILWAYS_2_2.js"></script>
    <script src="layers/ROAD_3.js"></script>
    <script src="layers/WATER_4.js"></script>
    <script src="layers/WATER1_1_5.js"></script>
    <script src="layers/Pandharpur1_6.js"></script>
    
    <script src="styles/BUIDING_0_style.js"></script>
    <script src="styles/LANDUSE_1_style.js"></script>
    <script src="styles/RAILWAYS_2_2_style.js"></script>
    <script src="styles/ROAD_3_style.js"></script>
    <script src="styles/WATER_4_style.js"></script>
    <script src="styles/WATER1_1_5_style.js"></script>
    <script src="styles/Pandharpur1_6_style.js"></script>
    
    <script src="./layers/layers.js" type="text/javascript"></script> 
    <script src="./resources/Autolinker.min.js"></script>
    <script src="./resources/qgis2web.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const layerMap = {
                'BUIDING_0': typeof lyr_BUIDING_0 !== 'undefined' ? lyr_BUIDING_0 : null,
                'LANDUSE_1': typeof lyr_LANDUSE_1 !== 'undefined' ? lyr_LANDUSE_1 : null,
                'RAILWAYS_2_2': typeof lyr_RAILWAYS_2_2 !== 'undefined' ? lyr_RAILWAYS_2_2 : null,
                'ROAD_3': typeof lyr_ROAD_3 !== 'undefined' ? lyr_ROAD_3 : null,
                'WATER_4': typeof lyr_WATER_4 !== 'undefined' ? lyr_WATER_4 : null,
                'WATER1_1_5': typeof lyr_WATER1_1_5 !== 'undefined' ? lyr_WATER1_1_5 : null,
                'Pandharpur1_6': typeof lyr_Pandharpur1_6 !== 'undefined' ? lyr_Pandharpur1_6 : null
            };

            Object.keys(layerMap).forEach(key => {
                const layer = layerMap[key];
                const toggle = document.getElementById(`toggle-${key}`);
                if (layer && toggle) {
                    toggle.addEventListener('change', (e) => {
                        layer.setVisible(e.target.checked);
                    });
                }
            });

            // Auto-zoom to layer extent if map is loaded
            setTimeout(() => {
                if (typeof map !== 'undefined' && typeof lyr_Pandharpur1_6 !== 'undefined') {
                    const extent = lyr_Pandharpur1_6.getSource().getExtent();
                    if (extent) {
                        map.getView().fit(extent, { size: map.getSize(), maxZoom: 16, padding: [50, 50, 50, 50] });
                    }
                }
            }, 500);
        });
    </script>
</body>
</html>
